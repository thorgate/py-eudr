[project]
name = "py-eudr"
version = "0.1.0"
description = "Python client for the EU Deforestation Regulation (EUDR) Information System SOAP API (V3 and V4)"
authors = [
    {name = "Sergey Kovalskiy",email = "sergey@thorgate.eu"}
]
readme = "README.md"
requires-python = ">=3.8.6,<4.0"
dependencies = [
    "zeep (>=4.3.1,<=5.0.0)",
    "xmlschema (>=3.4.3,<=4.0.0)",
    "backports-zoneinfo[tzdata] (>=0.2.1,<0.3.0); python_version<'3.9'",
    "backports-strenum (>=1.2.8,<2.0.0); python_version<'3.11'"
]

[tool.poetry]
packages = [{ include = "py_eudr" }]

[tool.poetry.group.dev.dependencies]
ruff = "*"
pytest = "*"
mypy = "*"
lxml = "*"

[tool.ruff]
target-version = "py38"
extend-exclude = ["py_eudr/schemas"]

[tool.ruff.format]
# Generated by scripts/generate_stubs.py; checked for freshness by the test-suite instead.
exclude = ["py_eudr/types/*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"py_eudr/types/*.pyi" = ["E501", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the EUDR acceptance environment (needs EUDR_USERNAME and EUDR_AUTHENTICATION_KEY)"]

[tool.mypy]
# mypy 2.x can not target 3.8; runtime 3.8 compatibility is covered by the tests.
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["backports.*", "lxml.*", "zeep.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
