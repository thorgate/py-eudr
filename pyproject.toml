[project]
name = "py-eudr"
version = "1.0.0"
description = "Python client for the EU Deforestation Regulation (EUDR) Information System SOAP API (V3 and V4)"
authors = [
    {name = "Sergey Kovalskiy",email = "sergey@thorgate.eu"}
]
readme = "README.md"
requires-python = ">=3.8.6,<4.0"
dependencies = [
    "zeep (>=4.3.1,<5)",
    "lxml (>=4.6)",
    "requests (>=2.7)",
]

[tool.poetry]
packages = [{ include = "py_eudr" }]

[tool.poetry.group.dev.dependencies]
ruff = "*"
pytest = "*"
mypy = "*"

[tool.ruff]
target-version = "py38"
extend-exclude = ["py_eudr/schemas"]

[tool.ruff.format]
# Generated by scripts/generate_stubs.py; checked for freshness by the test-suite instead.
exclude = ["py_eudr/types/*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"py_eudr/types/*.pyi" = ["E501", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call the acceptance environment; run them explicitly with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls the EUDR acceptance environment (needs EUDR_USERNAME and EUDR_AUTHENTICATION_KEY)"]

[tool.mypy]
# Checked against the running interpreter. mypy 2.x can not target Python 3.8;
# mypy 1.x can (--python-version 3.8).

[[tool.mypy.overrides]]
module = ["backports.*", "lxml.*", "zeep.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
